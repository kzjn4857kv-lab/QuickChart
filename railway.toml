[build]
builder = "nixpacks"
buildCommand = "pnpm install && BASE_PATH=/ PORT=3000 pnpm --filter @workspace/emr-app run build && pnpm --filter @workspace/api-server run build"

[deploy]
startCommand = "node --enable-source-maps artifacts/api-server/dist/index.mjs"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
